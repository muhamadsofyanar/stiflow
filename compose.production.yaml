name: stiflow

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  STIFLOW_PROTOTYPE_MODULES: "false"
  STIFLOW_ADMIN_EXTENDED_MODULES: "true"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-stiflow}
  DB_USERNAME: ${DB_USERNAME:-stiflow}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
  QUEUE_CONNECTION: database
  CACHE_STORE: file
  SESSION_DRIVER: database

x-app-service: &app-service
  image: ${STIFLOW_IMAGE:-stiflow:voucher-mvp}
  build:
    context: .
    target: runtime
  env_file:
    - .env
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - stiflow_storage:/var/www/html/storage

services:
  app:
    <<: *app-service
    command: ["web"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-service
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  scheduler:
    <<: *app-service
    command: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  db:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-stiflow}
      MARIADB_USER: ${DB_USERNAME:-stiflow}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - stiflow_mariadb:/var/lib/mysql

volumes:
  stiflow_storage:
  stiflow_mariadb:
