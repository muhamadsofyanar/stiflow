name: stiflow

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-stiflow}
  DB_USERNAME: ${DB_USERNAME:-stiflow}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
  QUEUE_CONNECTION: database
  CACHE_STORE: file
  SESSION_DRIVER: database

x-app-service: &app-service
  image: ${STIFLOW_IMAGE:-stiflow:voucher-mvp}
  build:
    context: .
    target: runtime
  env_file:
    - .env
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - stiflow_storage:/var/www/html/storage

services:
  app:
    <<: *app-service
    command: ["web"]
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app-service
    command: ["worker"]

  scheduler:
    <<: *app-service
    command: ["scheduler"]

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stiflow}
      MYSQL_USER: ${DB_USERNAME:-stiflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - stiflow_mysql:/var/lib/mysql

volumes:
  stiflow_storage:
  stiflow_mysql:
